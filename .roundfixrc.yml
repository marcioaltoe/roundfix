# Roundfix config.
# User Config: ~/.roundfix/config.yml
# Project Config: <repo>/.roundfixrc.yml

defaults:
  # Keep false. Setting it true is accepted by config validation and then rejected
  # by the codex adapter at session creation — `session/set_mode "full-access"`
  # answers ACP -32602 Invalid params — which fails every Task in the Run before
  # any Agent work starts. Measured on codex-acp 1.1.9, 2026-08-04.
  agent_full_access: false
  # Verification command for review Batches; Spec Tasks use their task file commands.
  # `make verify` is the complete gate here: fmt-check, the Go suite,
  # `roundfix skills check`, the build, and `roundfix spec check`.
  verification: make verify
  # Empty uses Roundfix Home artifacts/<repo-id>; set a path to override.
  artifact_dir: ""
  auto_commit: true
# Model identifiers are the ones each ACP adapter advertises. The catalog in
# internal/agent/catalog.go is picker metadata that must follow the adapter, and
# it did drift until 2026-08-07. The claude adapter advertises
# `opus` (as `opus[1m]`), `claude-fable-5`, `sonnet`, `haiku`, and `default`;
# reasoning effort is a separate adapter option. Snapshot and rationale:
# docs/references/model-selection.md.
#
# ---------------------------------------------------------------------------
# Revised 2026-08-08. Routing follows measured supply, not guesses. Both figures
# below were read from the providers on 2026-08-08; neither reverts itself.
#
# CODEX — OpenAI Pro. Weekly limit at 100% remaining, resets 2026-08-15 21:03
# America/Sao_Paulo. Full headroom, but a quota all the same: a long Run spends
# it, so this is not a licence to buy points with steps. The baseline stays
# sol/high, 69% in 37 steps, against xhigh's 71% in 44. Two points do not pay
# for 19% more turns when latency multiplies by turn count in a Run.
#
# CLAUDE — 68% of the week used, 32% left, resets 2026-08-10 14:00
# America/Sao_Paulo. A +50% weekly-limit promotion runs through 2026-08-19, so
# the headroom is larger than the percentage suggests. Claude still runs by
# default in one category only; everywhere else it sits last, where it consumes
# nothing unless both selections ahead of it fail to start. `frontend` is the
# deliberate exception: Claude leads there on design judgment that no benchmark
# on file measures, and the exposure is small — one frontend Task in the whole
# near queue.
#
# WHAT TO REVISIT, AND WHEN. On 2026-08-10 14:00, whether Claude should lead
# more than `frontend` again. On 2026-08-15 21:03, the codex reset — `review`
# already carries luna/max one step behind its preferred for exactly the moment
# price becomes a criterion again.
# ---------------------------------------------------------------------------
#
# Claude is last in every Fallback Chain except `frontend`, which it leads. The
# runtime that leads the other five varies by category: codex on general,
# backend, and qa; opencode on data and review. Every chain changes runtime at
# each step, because a fallback exists for when a runtime is unavailable and a
# second model on the same runtime does not help.
#
# NEVER route gpt-5.6-sol through OpenRouter. Every `gpt-5.6-sol` below is
# `runtime: codex`, which is the GPT subscription. The `opencode` runtime also
# advertises `openrouter/openai/gpt-5.6-sol`, and
# docs/references/model-selection.md documents that mapping — it is pay-per-use
# billing for a model this repository already has, so the mapping is reachable
# and wrong. The only OpenCode identifiers used here carry the `opencode-go/`
# prefix, which is the subscribed tier.
#
# Claude Fable 5 appears nowhere below. It answers in 1.7 minutes — roughly 25x
# Sol's latency — for a result Sol matches. In a Run, where latency multiplies
# by turn count, that trade never pays, and no subscription makes time free.
profiles:
  general:
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: high
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
  backend:
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: high
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
  frontend:
    # The one category Claude still leads, and the one place it runs by default
    # during the low week. Opus 5 at high scores 73% in 73 steps; the codex row
    # that matches it is sol/max at 61 steps, and sol/high does not — it scores
    # 69%. Claude is kept here on design judgment no benchmark on file measures,
    # so the chain accepts the weaker codex setting at its tail rather than
    # promoting a stronger one that would only ever run in an outage.
    preferred:
      runtime: claude
      model: opus
      reasoning_effort: high
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: codex
        model: gpt-5.6-sol
        reasoning_effort: high
  data:
    # The OpenCode route, kept preferred on purpose. Spec 0088 made this runtime
    # reachable and proved one Task on it; the subscribed `opencode-go` tier has
    # no row on the benchmark board, so the next Spec's data Tasks are also the
    # measurement that would justify promoting OpenCode anywhere else.
    #
    # reasoning_effort is empty on purpose, and Roundfix refuses any other value
    # here. OpenCode advertises effort per model and only after an Agent
    # Session's first prompt, so a token-free Exact Agent Selection Proof cannot
    # apply one; see ADR-0106. kimi-k3 runs at `max` by its own default, which
    # is also the only effort it advertises.
    #
    # kimi-k3 carries no usage multiplier. Two subscribed models do — gpt-5.6-luna
    # and deepseek-v4-flash bill at 2x — which inverts the obvious guess, since
    # deepseek-v4-pro carries none. Snapshot: docs/references/model-selection.md.
    #
    # kimi-k3 is an unmeasured bet, deliberately. The only benchmarked member of
    # the subscribed tier is deepseek-v4-flash at 53%, which fails against
    # sol/high's 69% and bills at 2x. deepseek-v4-pro is the alternative with
    # real evidence — the Secondbrain moved its whole stack onto it on
    # 2026-08-08 — but Roundfix cannot ask OpenCode for an effort, and
    # deepseek-v4-pro defaults to `high` while kimi-k3 advertises only `max`.
    # The daily monitoring lives in the Secondbrain; see the OpenCode section of
    # docs/references/model-selection.md for both sources.
    preferred:
      runtime: opencode
      model: opencode-go/kimi-k3
      reasoning_effort: ""
    fallbacks:
      - runtime: codex
        model: gpt-5.6-sol
        reasoning_effort: high
      - runtime: claude
        model: opus
        reasoning_effort: high
  qa:
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: high
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
  review:
    # The second place OpenCode leads, and the safest one. Review work is
    # bounded, has no dependency graph, and blocks nobody, so extra turns cost
    # wall clock and nothing else — which makes it the right category to spend
    # an unbenchmarked model on while the subscribed tier still has no row on
    # the board.
    #
    # luna/max sits behind it rather than in front: 67% for $0.61 against Sol's
    # 69% for $3.47, bought with 102 steps against 37. The discount buys little
    # while the codex week sits at 100% remaining, and the steps are a real
    # cost, but it stays the cheapest usable row on the board by an order of
    # magnitude — which is what makes it the right thing to weigh forward as
    # that headroom is spent.
    preferred:
      runtime: opencode
      model: opencode-go/kimi-k3
      reasoning_effort: ""
    fallbacks:
      - runtime: codex
        model: gpt-5.6-luna
        reasoning_effort: max
      - runtime: claude
        model: sonnet
        reasoning_effort: xhigh
specs:
  # Directory holding Spec folders; relative paths resolve against the repository root.
  root: "docs/specs"
worktree:
  # Parent directory; Roundfix always appends <repo-slug>/<run-id>.
  location: "~/.roundfix/worktrees"
  # Maximum concurrent Task Worktrees for spec Runs; 1 keeps sequential behavior.
  concurrency: 3
  # Repository-relative untracked files copied into each Run Worktree.
  # Empty copies no files.
  copy: []
  # Command run once after copy before Agent work; empty disables bootstrap.
  # Empty here on purpose: this is a Go repository with no package manifest at
  # the root, and a non-zero bootstrap exit fails the whole Run before any
  # Agent work starts.
  bootstrap: ""
  # Maximum time allowed for each worktree bootstrap command.
  bootstrap_timeout: 10m
store:
  # Terminal Run journals older than this duration are eligible for pruning; 0 keeps everything.
  journal_retention: 336h
review_source:
  name: coderabbit
  # Roundfix publishes the review request after a Round's Final Push. Required
  # here: .coderabbit.yaml disables automatic review, so with this false the
  # Preflight coherence check refuses watch and resolve — a Run would wait for
  # a review nobody asks for.
  request_review: true
  # false excludes CodeRabbit findings whose severity is nitpick.
  include_nitpicks: false
watch:
  until_clean: true
  max_rounds: 2
  poll_interval: 30s
  review_timeout: 30m
  check_grace_period: 5m
  quiet_period: 30s
  # auto_push runs only after no Unresolved Review Issues remain.
  auto_push: true
  # Leave empty to use the branch upstream detected by Preflight Validation.
  push_remote: ""
  push_branch: ""
implement:
  # auto_push runs only after a Clean spec Run and never creates pull requests.
  auto_push: false
notify:
  # false disables notifications entirely.
  enabled: true
  # Shell command run on terminal outcome; empty uses the native desktop notification.
  command: ""
budget:
  enabled: true
  max_run_duration: 2h
resolve:
  # Review Issues handed to one Agent Batch. Raised from 3 on 2026-08-05: the
  # 0012 review resolved 22 issues and the 0015 review 28, so a batch of 3 spent
  # most of the Run on Batch turnover rather than on the fixes.
  batch_size: 20
