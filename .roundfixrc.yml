# Roundfix config.
# User Config: ~/.roundfix/config.yml
# Project Config: <repo>/.roundfixrc.yml

defaults:
  # Keep false. Setting it true is accepted by config validation and then rejected
  # by the codex adapter at session creation — `session/set_mode "full-access"`
  # answers ACP -32602 Invalid params — which fails every Task in the Run before
  # any Agent work starts. Measured on codex-acp 1.1.9, 2026-08-04.
  agent_full_access: false
  # Verification command for review Batches; Spec Tasks use their task file commands.
  # `make verify` is the complete gate here: fmt-check, the Go suite,
  # `roundfix skills check`, the build, and `roundfix spec check`.
  verification: make verify
  # Empty uses Roundfix Home artifacts/<repo-id>; set a path to override.
  artifact_dir: ""
  auto_commit: true
# Model identifiers are the ones each ACP adapter advertises. The catalog in
# internal/agent/catalog.go is picker metadata that must follow the adapter, and
# it did drift until 2026-08-07. The claude adapter advertises
# `opus` (as `opus[1m]`), `claude-fable-5`, `sonnet`, `haiku`, and `default`;
# reasoning effort is a separate adapter option. Snapshot and rationale:
# docs/references/model-selection.md, 2026-08-07.
#
# Fallbacks are cross-runtime on purpose. A fallback exists for when the
# preferred Selection cannot start, and a second codex model does not help when
# codex is what is unavailable. Every fallback here changes runtime.
#
# Claude Fable 5 appears nowhere below. It answers in 1.7 minutes — roughly 25x
# Sol's latency — while costing the most per token on the board, for a result
# Sol matches at a third of the price. In a Run, where latency multiplies by
# turn count, that trade never pays.
profiles:
  general:
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: medium
  backend:
    # Sol at high takes 37 steps, fewer than anything near its quality. Raise to
    # xhigh for a hard Spec: 71% against 69%, at 44 steps and +35% cost.
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  frontend:
    # Lowered from xhigh: Opus 5 scores 73% at both settings, so xhigh bought
    # nothing and cost $9.07 against $6.08 with 16 more steps. Claude is
    # preferred here on design judgment, which no benchmark on file measures.
    preferred:
      runtime: claude
      model: opus
      reasoning_effort: high
    fallbacks:
      - runtime: codex
        model: gpt-5.6-sol
        reasoning_effort: high
  qa:
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  review:
    # Luna at max: 67% against Sol's 69%, for $0.61 against $3.47. It spends 102
    # steps against 37, but answers in 4.1s against 9.4s, so the two nearly
    # cancel. Review work is bounded and has no dependency graph, so extra turns
    # block nobody.
    preferred:
      runtime: codex
      model: gpt-5.6-luna
      reasoning_effort: max
    fallbacks:
      - runtime: claude
        model: sonnet
        reasoning_effort: xhigh
specs:
  # Directory holding Spec folders; relative paths resolve against the repository root.
  root: "docs/specs"
worktree:
  # Parent directory; Roundfix always appends <repo-slug>/<run-id>.
  location: "~/.roundfix/worktrees"
  # Maximum concurrent Task Worktrees for spec Runs; 1 keeps sequential behavior.
  concurrency: 3
  # Repository-relative untracked files copied into each Run Worktree.
  # Empty copies no files.
  copy: []
  # Command run once after copy before Agent work; empty disables bootstrap.
  # Empty here on purpose: this is a Go repository with no package manifest at
  # the root, and a non-zero bootstrap exit fails the whole Run before any
  # Agent work starts.
  bootstrap: ""
  # Maximum time allowed for each worktree bootstrap command.
  bootstrap_timeout: 10m
store:
  # Terminal Run journals older than this duration are eligible for pruning; 0 keeps everything.
  journal_retention: 336h
review_source:
  name: coderabbit
  # Roundfix publishes the review request after a Round's Final Push. Required
  # here: .coderabbit.yaml disables automatic review, so with this false the
  # Preflight coherence check refuses watch and resolve — a Run would wait for
  # a review nobody asks for.
  request_review: true
  # false excludes CodeRabbit findings whose severity is nitpick.
  include_nitpicks: false
watch:
  until_clean: true
  max_rounds: 2
  poll_interval: 30s
  review_timeout: 30m
  check_grace_period: 5m
  quiet_period: 30s
  # auto_push runs only after no Unresolved Review Issues remain.
  auto_push: true
  # Leave empty to use the branch upstream detected by Preflight Validation.
  push_remote: ""
  push_branch: ""
implement:
  # auto_push runs only after a Clean spec Run and never creates pull requests.
  auto_push: false
notify:
  # false disables notifications entirely.
  enabled: true
  # Shell command run on terminal outcome; empty uses the native desktop notification.
  command: ""
budget:
  enabled: true
  max_run_duration: 2h
resolve:
  # Review Issues handed to one Agent Batch. Raised from 3 on 2026-08-05: the
  # 0012 review resolved 22 issues and the 0015 review 28, so a batch of 3 spent
  # most of the Run on Batch turnover rather than on the fixes.
  batch_size: 20
