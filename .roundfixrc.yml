# Roundfix config.
# User Config: ~/.roundfix/config.yml
# Project Config: <repo>/.roundfixrc.yml

defaults:
  # Keep false. Setting it true is accepted by config validation and then rejected
  # by the codex adapter at session creation — `session/set_mode "full-access"`
  # answers ACP -32602 Invalid params — which fails every Task in the Run before
  # any Agent work starts. Measured on codex-acp 1.1.9, 2026-08-04.
  agent_full_access: false
  # Verification command for review Batches; Spec Tasks use their task file commands.
  # `make verify` is the complete gate here: fmt-check, the Go suite,
  # `roundfix skills check`, the build, and `roundfix spec check`.
  verification: make verify
  # Empty uses Roundfix Home artifacts/<repo-id>; set a path to override.
  artifact_dir: ""
  auto_commit: true
# Model identifiers are the ones each ACP adapter advertises. The catalog in
# internal/agent/catalog.go is picker metadata that must follow the adapter, and
# it did drift until 2026-08-07. The claude adapter advertises
# `opus` (as `opus[1m]`), `claude-fable-5`, `sonnet`, `haiku`, and `default`;
# reasoning effort is a separate adapter option. Snapshot and rationale:
# docs/references/model-selection.md.
#
# ---------------------------------------------------------------------------
# Revised 2026-08-08. EVERY CHANGE BELOW IS TEMPORARY. Two windows, two expiry
# dates, and neither reverts itself. Read both before editing.
#
# WINDOW A — until 2026-08-12. Codex is unlimited, so cost is not a selection
# criterion and every clause that picked a weaker setting to save money is
# suspended. Selection is by result and by step count, because steps still cost
# wall clock and latency multiplies by turn count in a Run. From the 2026-08-07
# board: sol/xhigh scores 71% in 44 steps, sol/high 69% in 37, sol/max 73% in
# 61. xhigh is the working baseline; max is reserved for the one category where
# it displaces a stronger model.
#
# ON 2026-08-12, codex returns to a quota and cost becomes a criterion again.
# What to weigh back: `general`, `backend`, `qa` at sol/high (69% for $3.47
# against xhigh's 71% for $4.70), and `review` at luna/max, which scored 67% for
# $0.61 and was the cheapest usable row on the board by an order of magnitude.
#
# WINDOW B — until 2026-08-10 14:00 America/Sao_Paulo. The Anthropic weekly
# limit is low, so Claude is demoted to last resort everywhere. A fallback
# consumes nothing unless the selections ahead of it cannot start, so Claude
# keeps its place as the safety net and simply stops running by default.
#
# ON THE 08-10 RESET, one line is worth weighing back, not the whole file:
# `frontend` preferred was `claude / opus / high`, chosen on design judgment
# that no benchmark on file measures.
# ---------------------------------------------------------------------------
#
# Fallback Chain order is codex, then opencode, then claude. Every chain changes
# runtime at each step, because a fallback exists for when a runtime is
# unavailable and a second model on the same runtime does not help. Claude last
# is what conserves it.
#
# NEVER route gpt-5.6-sol through OpenRouter. Every `gpt-5.6-sol` below is
# `runtime: codex`, which is the unlimited GPT subscription. The `opencode`
# runtime also advertises `openrouter/openai/gpt-5.6-sol`, and
# docs/references/model-selection.md documents that mapping — it is pay-per-use
# billing for a model this repository already has for free, so the mapping is
# reachable and wrong. The only OpenCode identifiers used here carry the
# `opencode-go/` prefix, which is the subscribed tier.
#
# Claude Fable 5 appears nowhere below. It answers in 1.7 minutes — roughly 25x
# Sol's latency — for a result Sol matches. In a Run, where latency multiplies
# by turn count, that trade never pays, and no subscription makes time free.
profiles:
  general:
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: xhigh
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
  backend:
    # Raised from high. The file's own note already recommended xhigh for a hard
    # Spec — 71% against 69% at 44 steps — and objected only to the +35% cost,
    # which no longer exists.
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: xhigh
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
  frontend:
    # The only category where Claude ran by default, and therefore the only one
    # where conserving it costs quality. sol/max is the single codex row that
    # matches Opus 5 at high: both score 73%. It spends 61 steps against Opus's
    # 73, so the substitution is not slower. Design judgment is the part no
    # benchmark measures — weigh this line again after the 08-10 reset.
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: max
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
  data:
    # The OpenCode route, kept preferred on purpose. Spec 0088 made this runtime
    # reachable and proved one Task on it; the subscribed `opencode-go` tier has
    # no row on the benchmark board, so the next Spec's data Tasks are also the
    # measurement that would justify promoting OpenCode anywhere else.
    #
    # reasoning_effort is empty on purpose, and Roundfix refuses any other value
    # here. OpenCode advertises effort per model and only after an Agent
    # Session's first prompt, so a token-free Exact Agent Selection Proof cannot
    # apply one; see ADR-0106. kimi-k3 runs at `max` by its own default, which
    # is also the only effort it advertises.
    #
    # kimi-k3 carries no usage multiplier. Two subscribed models do — gpt-5.6-luna
    # and deepseek-v4-flash bill at 2x — which inverts the obvious guess, since
    # deepseek-v4-pro carries none. Snapshot: docs/references/model-selection.md.
    preferred:
      runtime: opencode
      model: opencode-go/kimi-k3
      reasoning_effort: ""
    fallbacks:
      - runtime: codex
        model: gpt-5.6-sol
        reasoning_effort: xhigh
      - runtime: claude
        model: opus
        reasoning_effort: high
  qa:
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: xhigh
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
  review:
    # Replaced luna/max. That pick was entirely economic — 67% for $0.61 against
    # Sol's 69% for $3.47 — and it bought the discount with 102 steps against
    # 37. With cost gone, luna loses on both axes at once: sol/xhigh scores 71%
    # in 44 steps.
    preferred:
      runtime: codex
      model: gpt-5.6-sol
      reasoning_effort: xhigh
    fallbacks:
      - runtime: opencode
        model: opencode-go/kimi-k3
        reasoning_effort: ""
      - runtime: claude
        model: opus
        reasoning_effort: high
specs:
  # Directory holding Spec folders; relative paths resolve against the repository root.
  root: "docs/specs"
worktree:
  # Parent directory; Roundfix always appends <repo-slug>/<run-id>.
  location: "~/.roundfix/worktrees"
  # Maximum concurrent Task Worktrees for spec Runs; 1 keeps sequential behavior.
  concurrency: 3
  # Repository-relative untracked files copied into each Run Worktree.
  # Empty copies no files.
  copy: []
  # Command run once after copy before Agent work; empty disables bootstrap.
  # Empty here on purpose: this is a Go repository with no package manifest at
  # the root, and a non-zero bootstrap exit fails the whole Run before any
  # Agent work starts.
  bootstrap: ""
  # Maximum time allowed for each worktree bootstrap command.
  bootstrap_timeout: 10m
store:
  # Terminal Run journals older than this duration are eligible for pruning; 0 keeps everything.
  journal_retention: 336h
review_source:
  name: coderabbit
  # Roundfix publishes the review request after a Round's Final Push. Required
  # here: .coderabbit.yaml disables automatic review, so with this false the
  # Preflight coherence check refuses watch and resolve — a Run would wait for
  # a review nobody asks for.
  request_review: true
  # false excludes CodeRabbit findings whose severity is nitpick.
  include_nitpicks: false
watch:
  until_clean: true
  max_rounds: 2
  poll_interval: 30s
  review_timeout: 30m
  check_grace_period: 5m
  quiet_period: 30s
  # auto_push runs only after no Unresolved Review Issues remain.
  auto_push: true
  # Leave empty to use the branch upstream detected by Preflight Validation.
  push_remote: ""
  push_branch: ""
implement:
  # auto_push runs only after a Clean spec Run and never creates pull requests.
  auto_push: false
notify:
  # false disables notifications entirely.
  enabled: true
  # Shell command run on terminal outcome; empty uses the native desktop notification.
  command: ""
budget:
  enabled: true
  max_run_duration: 2h
resolve:
  # Review Issues handed to one Agent Batch. Raised from 3 on 2026-08-05: the
  # 0012 review resolved 22 issues and the 0015 review 28, so a batch of 3 spent
  # most of the Run on Batch turnover rather than on the fixes.
  batch_size: 20
