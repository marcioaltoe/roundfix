# Roundfix config.
# User Config: ~/.roundfix/config.yml
# Project Config: <repo>/.roundfixrc.yml

verification:
  tools: [go, gofmt, git, make]

delivery:
  item_binary:
    build: make build
    path: bin/roundfix
  derived_paths:
    - paths:
        - internal/baseline/testdata/catalog.digest
        - internal/baseline/testdata/catalog.normalized.json
        - internal/baseline/testdata/catalog.diagnostics.golden.json
        - internal/baseline/testdata/plan-characterization/*.golden.json
      regenerate: make baseline-digests
    - paths:
        - docs/agents/setup-context.json
      regenerate: go run -buildvcs=false ./cmd/roundfix baseline update --repo . --no-skills --yes --format text
    - paths:
        - skills/testdata/owned-skill-versions.json
      lines:
        paths: [.agents/skills/*/SKILL.md, skills/*/SKILL.md]
        match: '^ *version: '
      regenerate: go test ./skills -run '^TestEveryOwnedSkillVersionIsRecorded$' -record-skill-versions

defaults:
  # Keep false. Setting it true is accepted by config validation and then rejected
  # by the codex adapter at session creation — `session/set_mode "full-access"`
  # answers ACP -32602 Invalid params — which fails every Task in the Run before
  # any Agent work starts. Measured on codex-acp 1.1.9, 2026-08-04.
  agent_full_access: false
  # Selective repository Verification for review Batches and Run QA gates.
  # Use `make verify` for the complete gate on main and releases.
  verification: make verify-changed
  # Empty uses Roundfix Home artifacts/<repo-id>; set a path to override.
  artifact_dir: ""
  auto_commit: true
# Model identifiers are the ones each ACP adapter advertises. The catalog in
# internal/agent/catalog.go is picker metadata that must follow the adapter, and
# it has drifted twice (2026-08-07 and 2026-09-30). Reasoning effort is a
# separate adapter option. Snapshot and rationale:
# docs/references/model-selection.md.
#
# ---------------------------------------------------------------------------
# Revised 2026-09-30 (maintainer decision: adopt the current models directly,
# fallbacks included, and revert if Runs get worse). Every tuple below was
# proved through the installed adapters with `roundfix profiles configure`.
#
# IMPLEMENTATION (general, backend, data, qa, infra, test): codex
# `gpt-6.1-sol`/high. OpenAI released it on 2026-09-29 as the Codex workhorse,
# in the same quota band as `gpt-5.6-sol`. Published evidence is mixed (one
# index up, one slightly down), so this is measured on the Runs themselves:
# from 2026-09-15 to 09-30, `gpt-5.6-sol`/high averaged 18.8 minutes per
# backend session and 15.1 per qa session.
#
# FRONTEND: claude `opus`/high. The alias resolves to Opus 5.5 since Claude
# Code 2.1.280, so this tuple changed model without changing text.
#
# REVIEW, DOCS, CHORE: codex `gpt-5.6-luna`/max, which averaged about 5 minutes
# per session here. `gpt-6-luna` shows no published gain over it.
#
# FALLBACKS. A fallback exists for when a runtime is unavailable, so it
# changes runtime: claude `opus` behind codex, codex `gpt-6.1-sol`/xhigh
# behind claude, and claude `sonnet` (Sonnet 5.5) behind the luna categories.
# `review` is the exception: every selection in it must use the runtime of
# `pre_pr_review.provider`, so its fallback stays on codex.
#
# NOT USED IN RUNS. `gpt-6-astra` and Claude Fable drain quota several times
# faster and answer more slowly, and in a Run latency multiplies by turn
# count. No `opencode` tuple is configured: no model it reaches beats the two
# subscription runtimes on the published boards.
#
# NEVER route a `gpt-*-sol` model through OpenRouter. Every one below is
# `runtime: codex`, which is the GPT subscription. The `opencode` runtime can
# reach the same models pay-per-use, which is billing for a model this
# repository already has.
#
# Research and sources: the Secondbrain entry
# `inbox/secondbrain/2026-09-30-modelos-de-codificacao-ago-set-2026-e-runtimes-cursor-grok.md`.
# docs/references/model-selection.md states the same snapshot as the binary.
# ---------------------------------------------------------------------------
profiles:
  general:
    preferred:
      runtime: codex
      model: gpt-6.1-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  backend:
    preferred:
      runtime: codex
      model: gpt-6.1-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  frontend:
    preferred:
      runtime: claude
      model: opus
      reasoning_effort: high
    fallbacks:
      - runtime: codex
        model: gpt-6.1-sol
        reasoning_effort: xhigh
  data:
    preferred:
      runtime: codex
      model: gpt-6.1-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  qa:
    preferred:
      runtime: codex
      model: gpt-6.1-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  review:
    preferred:
      runtime: codex
      model: gpt-5.6-luna
      reasoning_effort: max
    fallbacks:
      - runtime: codex
        model: gpt-6.1-sol
        reasoning_effort: high
  infra:
    preferred:
      runtime: codex
      model: gpt-6.1-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  docs:
    preferred:
      runtime: codex
      model: gpt-5.6-luna
      reasoning_effort: max
    fallbacks:
      - runtime: claude
        model: sonnet
        reasoning_effort: high
  test:
    preferred:
      runtime: codex
      model: gpt-6.1-sol
      reasoning_effort: high
    fallbacks:
      - runtime: claude
        model: opus
        reasoning_effort: high
  chore:
    preferred:
      runtime: codex
      model: gpt-5.6-luna
      reasoning_effort: max
    fallbacks:
      - runtime: claude
        model: sonnet
        reasoning_effort: high
specs:
  # Directory holding Spec folders; relative paths resolve against the repository root.
  root: "docs/specs"
worktree:
  # Parent directory; Roundfix always appends <repo-slug>/<run-id>.
  location: "~/.roundfix/worktrees"
  # Maximum concurrent Task Worktrees for spec Runs; 1 keeps sequential behavior.
  concurrency: 3
  # Repository-relative untracked files copied into each Run Worktree.
  # Empty copies no files.
  copy: []
  # Command run once after copy before Agent work; empty disables bootstrap.
  # Empty here on purpose: this is a Go repository with no package manifest at
  # the root, and a non-zero bootstrap exit fails the whole Run before any
  # Agent work starts.
  bootstrap: ""
  # Maximum time allowed for each worktree bootstrap command.
  bootstrap_timeout: 10m
store:
  # Terminal Run journals older than this duration are eligible for pruning; 0 keeps everything.
  journal_retention: 336h
review_source:
  name: coderabbit
  # Roundfix publishes the review request after a Round's Final Push. Required
  # here: .coderabbit.yaml disables automatic review, so with this false the
  # Preflight coherence check refuses watch and resolve — a Run would wait for
  # a review nobody asks for.
  request_review: true
  # false excludes CodeRabbit findings whose severity is nitpick. Re-enabled
  # 2026-08-08: nitpicks were off because resolve ran on the codex quota, where
  # a long tail of low-severity findings competed with implementation work for
  # the same budget. Resolve now routes through `review`, which leads with the
  # OpenCode subscription, so the tail costs subscription time rather than a
  # quota the Task Graph also needs.
  include_nitpicks: true
watch:
  until_clean: true
  max_rounds: 2
  poll_interval: 30s
  review_timeout: 30m
  check_grace_period: 5m
  quiet_period: 30s
  # auto_push runs only after no Unresolved Review Issues remain.
  auto_push: true
  # Leave empty to use the branch upstream detected by Preflight Validation.
  push_remote: ""
  push_branch: ""
implement:
  # auto_push runs only after a Clean spec Run and never creates pull requests.
  auto_push: false
notify:
  # false disables notifications entirely.
  enabled: true
  # Shell command run on terminal outcome; empty uses the native desktop notification.
  command: ""
budget:
  enabled: true
  # Back to 2h on 2026-09-29 (maintainer approval). Spec 0177 renews the budget
  # at each Task settlement, and no Wave 4 Run exceeded 62 minutes (44, 62 and
  # 16 minutes measured). It had been raised to 4h on 2026-09-28, after serial
  # Task Graphs stopped four Runs at BudgetExceeded before that renewal existed.
  max_run_duration: 2h
resolve:
  # Review Issues handed to one Agent Batch. Raised from 3 on 2026-08-05: the
  # 0012 review resolved 22 issues and the 0015 review 28, so a batch of 3 spent
  # most of the Run on Batch turnover rather than on the fixes.
  batch_size: 20
