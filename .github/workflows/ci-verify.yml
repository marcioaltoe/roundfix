name: CI | Verify

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parts:
    name: Part (${{ matrix.part }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [packages, cli-1, cli-2, contracts-repo, contracts-docs]
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Historical authorization contracts read retained main ancestors.
          fetch-depth: 0
          persist-credentials: false

      # cache: true restores GOMODCACHE and GOCACHE between runs, so CI stops
      # re-downloading modules and recompiling the whole module from nothing.
      # The verdict stays complete: -count=1 below ignores any cached test
      # result, so every test still executes — only compilation is reused.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # The Makefile pins GOCACHE to the repository-local .gocache only when
      # the environment does not set it. setup-go restored Go's default cache
      # directory, so name that directory explicitly or the restored cache
      # goes unused.
      - name: Align GOCACHE with the restored cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Merge the current base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_sha="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          git -c user.name='CI' -c user.email='ci@example.com' merge --no-ff --no-edit "$base_sha"
          echo "VERIFY_BASE=$base_sha" >> "$GITHUB_ENV"
          echo "::notice title=tested-base::$base_sha"

      # Each part reports its Gate Time Report and writes the per-test times
      # from gate-time tests to GITHUB_STEP_SUMMARY through verify-part.
      - name: Verify part
        run: make verify-part PART=${{ matrix.part }}

  verify:
    name: Verification gate
    runs-on: macos-26
    timeout-minutes: 60
    needs: parts
    if: ${{ always() }}
    steps:
      - name: Gather verification parts
        run: test '${{ needs.parts.result }}' = success
