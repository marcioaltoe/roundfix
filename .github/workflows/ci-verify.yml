name: CI | Verify

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cache: true restores GOMODCACHE and GOCACHE between runs, so CI stops
      # re-downloading modules and recompiling the whole module from nothing.
      # The verdict stays complete: -count=1 below ignores any cached test
      # result, so every test still executes — only compilation is reused.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # The Makefile pins GOCACHE to the repository-local .gocache only when
      # the environment does not set it. setup-go restored Go's default cache
      # directory, so name that directory explicitly or the restored cache
      # goes unused.
      - name: Align GOCACHE with the restored cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      # The local gate lets Go's test result cache decide what to re-run, so an
      # implementation loop pays only for what it changed. CI is the tier that
      # owes a verdict on the whole tree, so it forces a fresh run: -count=1
      # disables the result cache and every package executes.
      # VERIFY_TEST_TARGET routes the gate through the previously orphaned
      # test-budget target, so CI fails when the suite's wall clock regresses
      # past the budget, not only when a test fails.
      - name: Verify
        env:
          GOFLAGS: -count=1
          VERIFY_TEST_TARGET: test-budget
          SUITE_BUDGET_SECONDS: "240"
        run: make verify

      # Repository-markdown contracts run at the pull request boundary. CI is
      # that boundary's fail-closed enforcement: a PR whose prose lies about
      # the binary, or whose Spec corpus is inconsistent, fails here.
      - name: Verify docs
        run: make verify-docs
