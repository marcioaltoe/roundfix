name: CI | Verify

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          # Historical authorization contracts read retained main ancestors.
          fetch-depth: 0
          persist-credentials: false

      # cache: true restores GOMODCACHE and GOCACHE between runs, so CI stops
      # re-downloading modules and recompiling the whole module from nothing.
      # The verdict stays complete: -count=1 below ignores any cached test
      # result, so every test still executes — only compilation is reused.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # The Makefile pins GOCACHE to the repository-local .gocache only when
      # the environment does not set it. setup-go restored Go's default cache
      # directory, so name that directory explicitly or the restored cache
      # goes unused.
      - name: Align GOCACHE with the restored cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Merge the current base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_sha="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          git -c user.name='CI' -c user.email='ci@example.com' merge --no-ff --no-edit "$base_sha"
          echo "VERIFY_BASE=$base_sha" >> "$GITHUB_ENV"
          echo "::notice title=tested-base::$base_sha"

      # Pull requests run the sets affected since the base branch head. The
      # full-history checkout above lets the selector resolve their merge base.
      - name: Verify changed
        if: github.event_name == 'pull_request'
        env:
          GOFLAGS: -count=1
        run: make verify-changed

      # Pushes to main owe a fresh verdict on the whole tree. -count=1 disables
      # the result cache, and the budget target catches wall-clock regressions.
      - name: Verify
        if: github.event_name == 'push'
        env:
          GOFLAGS: -count=1
          VERIFY_TEST_TARGET: test-budget
          SUITE_BUDGET_SECONDS: "240"
        run: make verify

      # Repository-markdown contracts run at the pull request boundary. CI is
      # that boundary's fail-closed enforcement: a PR whose prose lies about
      # the binary, or whose Spec corpus is inconsistent, fails here.
      - name: Verify docs
        run: make verify-docs
