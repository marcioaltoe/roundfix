name: CI | Verify

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      # The local gate lets Go's test result cache decide what to re-run, so an
      # implementation loop pays only for what it changed. CI is the tier that
      # owes a verdict on the whole tree, so it forces a fresh run: -count=1
      # disables the result cache and every package executes.
      - name: Verify
        env:
          GOFLAGS: -count=1
        run: make verify
