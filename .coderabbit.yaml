# Merge this file over the organization settings instead of replacing them.
# Without it CodeRabbit uses only the highest-priority source, so every key the
# organization sets and this file omits falls back to the schema default rather
# than to the organization value.
inheritance: true

reviews:
  auto_review:
    enabled: false
    description_keyword: "coderabbit:review"
  # high_level_summary and sequence_diagrams are owned by the organization
  # settings; declaring them here would override that choice.
  profile: "assertive"
  path_filters:
    # =====================================================================
    # Files excluded from review, grouped by type
    # =====================================================================

    # ----- Agent / tooling configs (NOT code) -----
    # .agents/skills/** is deliberately absent: skills are the CLI's public
    # contract in this repository, and a pull request that changes CLI
    # behaviour must ship the skill update with it, so that update is exactly
    # what needs reviewing. It is allowlisted below.
    - "!.claude/**"
    - "!.cursor/**"

    # ----- Generated skill mirror (byte-identical to .agents/skills) -----
    # Markdown only: skills/ also holds Go source, which stays reviewable.
    - "!skills/**/*.md"

    # ----- IDE / editor / OS noise -----
    - "!.vscode/**"
    - "!.idea/**"
    - "!**/.DS_Store"
    - "!**/Thumbs.db"
    - "!**/*.swp"
    - "!**/*.sw?"

    # ----- TypeScript / JavaScript build output -----
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/dist-ssr/**"
    - "!**/node_modules/**"
    - "!**/out/**"
    - "!**/.next/**"
    - "!**/.turbo/**"
    - "!**/.cache/**"
    - "!**/.parcel-cache/**"
    - "!**/.vercel/**"
    - "!**/.mastra/**"
    - "!**/storybook-static/**"
    - "!**/*.tsbuildinfo"

    # ----- Auto-generated code (Drizzle, TanStack Router, OpenAPI, TS) -----
    - "!**/routeTree.gen.ts"
    - "!**/generated/**"
    - "!**/*generated*.ts"
    - "!**/database/migrations/**"
    - "!**/drizzle/**"
    - "!**/openapi.json"
    - "!**/openapi.yaml"
    - "!**/next-env.d.ts"

    # ----- Go -----
    - "!**/vendor/**"

    # ----- Rust -----
    - "!**/target/debug/**"
    - "!**/target/release/**"

    # ----- Python -----
    - "!**/.venv/**"
    - "!**/venv/**"
    - "!**/*.egg-info/**"
    - "!**/__pycache__/**"
    - "!**/.pytest_cache/**"
    - "!**/.mypy_cache/**"
    - "!**/.ruff_cache/**"
    - "!**/.tox/**"

    # ----- Lock / package manager noise -----
    - "!**/bun.lockb"
    - "!**/.pnp.*"
    - "!**/.yarn/**"

    # ----- Test coverage output -----
    - "!**/coverage/**"
    - "!**/.nyc_output/**"

    # ----- Test fixtures -----
    - "!**/fixtures/**"
    - "!**/__fixtures__/**"

    # ----- Logs / temp / runtime -----
    - "!**/logs/**"
    - "!**/*.log"
    - "!**/*storybook.log"
    - "!**/.tmp/**"
    - "!**/.eslintcache"

    # ----- Local databases / runtime data -----
    - "!**/*.db"
    - "!**/*.db-shm"
    - "!**/*.db-wal"
    - "!**/.storage/**"

    # ----- Secrets / env -----
    - "!**/.env"
    - "!**/.env.local"
    - "!**/.env.*.local"
    - "!**/*.local"
    - "!**/*.pem"

    # ----- One-off scripts -----
    - "!scripts/**"

    # =====================================================================
    # Files reviewed (explicit allowlist), grouped by type
    # =====================================================================

    # ----- TypeScript / JavaScript -----
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.cjs"

    # ----- Styles / markup -----
    - "**/*.css"
    - "**/*.html"

    # ----- SQL -----
    - "**/*.sql"

    # ----- Go -----
    - "**/*.go"
    - "**/go.mod"
    - "go.mod"

    # ----- Rust -----
    - "**/*.rs"
    - "**/Cargo.toml"
    - "Cargo.toml"

    # ----- Python -----
    - "**/*.py"
    - "**/*.pyi"
    - "**/pyproject.toml"
    - "pyproject.toml"
    - "**/requirements*.txt"
    - "requirements*.txt"

    # ----- Node / workspace manifests -----
    - "**/package.json"
    - "package.json"
    - "**/tsconfig*.json"
    - "tsconfig*.json"
    - "turbo.json"

    # ----- Build / container -----
    - "Makefile"
    - "**/Makefile"
    - "Dockerfile"
    - "**/Dockerfile"
    - "docker-compose.yml"
    - "docker-compose.*.yml"

    # ----- CI -----
    - ".github/**/*"

    # ----- Documentation (Specs, ADRs, glossary, READMEs) -----
    - "docs/**/*.md"
    - "CONTEXT.md"
    - "**/README.md"
    - "README.md"

    # ----- Skill definitions (the CLI's public contract) -----
    # Restored: the exclusion list above says skills are "allowlisted below",
    # and the knowledge_base entry says "reviewed: see path_filters". Both were
    # left pointing at a line that no longer existed, so skill diffs stopped
    # being reviewed while two comments promised they were. This repository
    # requires a pull request that changes CLI behaviour to ship the skill
    # update with it, which makes that update exactly what needs reviewing.
    - ".agents/skills/**/*.md"

    # ----- Repository configuration -----
    - ".coderabbit.yaml"
    - ".roundfixrc.yml"

    # =====================================================================
    # Arquivado — nunca revisado
    # =====================================================================
    # Arquivar move o arquivo sem mudar uma linha dele, e um rename aparece no
    # diff como arquivo inteiro. Sem isto, o commit que arquiva uma Spec faz o
    # CodeRabbit revisar a Spec toda outra vez — conteúdo que já foi revisado
    # quando foi escrito, e que o `docs-layout.md` trata como história imutável.
    #
    # O que faz estas linhas vencerem as inclusões acima é a semântica
    # documentada do CodeRabbit, não a posição: "files not matching any
    # exclude pattern are included by default" — uma exclusão vence onde quer
    # que esteja. A posição no fim é só arrumação, e não pode ser mecanismo:
    # com `inheritance: true`, os padrões da organização são apensados DEPOIS
    # dos deste arquivo, então nada aqui tem garantia de ser o último.
    #
    # Sem sufixo `.md`: sob esses caminhos há `.excalidraw`, `.json` e `.txt` de
    # evidência de QA, e um `.tsx` em `docs/reference/archive/gss-migration/`
    # que casava com `**/*.tsx` e era revisado apesar de arquivado.
    #
    # `_archived` e `_reviews` valem em qualquer lugar: o prefixo `_` é
    # convenção deste repositório para "não é código". `archive` fica preso a
    # `docs/` de propósito — sem underscore, é nome plausível de módulo real, e
    # excluir código por causa do nome de uma pasta é pior que revisar história.
    # archive root: _archived/ (must match internal/spec.ArchiveDir)
    - "!**/_archived/**"
    - "!**/_reviews/**"
    - "!docs/**/archive/**"

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      # ===================================================================
      # Documents CodeRabbit reads as project rules, grouped by authority
      # ===================================================================

      # ----- Agent instructions (root pointers + the guides they route to) -----
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - "docs/agents/**/*.md"
      - "**/docs/agents/**/*.md"

      # ----- Architecture decisions -----
      - "docs/adr/**/*.md"
      - "**/docs/adr/**/*.md"

      # ----- Domain glossary -----
      - "CONTEXT.md"
      - "**/CONTEXT.md"

      # ----- Design contract -----
      - "DESIGN.md"
      - "**/DESIGN.md"

      # ----- Database contract -----
      - "DATABASE.md"
      - "**/DATABASE.md"

      # ----- Skill definitions (read as rules, and reviewed: see path_filters) -----
      - ".agents/skills/**/*.md"
      - ".claude/skills/**/*.md"

      # filePatterns não documenta negação com `!`, então nada arquivado pode
      # ser excluído daqui — a proteção é nenhum padrão acima alcançar uma
      # árvore `_archived`. Ao adicionar um padrão, confira que ele não casa
      # com material arquivado: um guia arquivado lido como regra injeta
      # instrução morta em toda revisão futura.
